name: Checkpoint recovery experience

on:
  pull_request:
    paths:
      - 'experience/checkpoint-recovery-desk.js'
      - 'scripts/checkpoint-recovery-desk.mjs'
      - 'scripts/checkpoint-recovery-browser-selftest.mjs'
      - 'test/checkpoint-recovery-desk.test.js'
      - 'docs/CHECKPOINT_RECOVERY_DESK_V0_1.md'
      - '.github/workflows/checkpoint-recovery-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full repository tests
        run: npm test
      - name: Install pinned browser test harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise exact checkpoint recovery surface
        run: node scripts/checkpoint-recovery-browser-selftest.mjs
      - name: Preserve rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-recovery-experience
          path: artifacts/checkpoint-recovery-experience/
          if-no-files-found: error
          retention-days: 14
