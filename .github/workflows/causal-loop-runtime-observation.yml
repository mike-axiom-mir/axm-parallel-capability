name: Causal Loop runtime observation

on:
  push:
    paths:
      - 'src/causal-loop-runtime.js'
      - 'test/causal-loop-runtime.test.js'
      - 'examples/causal-loop-runtime-observation.js'
      - 'docs/CAUSAL_LOOP_RUNTIME_OBSERVATION.md'
      - '.github/workflows/causal-loop-runtime-observation.yml'
  pull_request:
    paths:
      - 'src/causal-loop-runtime.js'
      - 'test/causal-loop-runtime.test.js'
      - 'examples/causal-loop-runtime-observation.js'
      - 'docs/CAUSAL_LOOP_RUNTIME_OBSERVATION.md'
      - '.github/workflows/causal-loop-runtime-observation.yml'

permissions:
  contents: read

env:
  PROVIDER_HEAD: cb2793fbb48efd750670bd9d08abe5a0bfa233df

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout Parallel Capability Fabric
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run complete consumer suite before adding provider checkout
        run: npm test

      - name: Checkout exact Causal Loop provider head
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-casual-loop
          ref: ${{ env.PROVIDER_HEAD }}
          path: .provider/axm-casual-loop
          persist-credentials: false

      - name: Set up provider Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prove pinned provider checkout identity
        run: test "$(git -C "$GITHUB_WORKSPACE/.provider/axm-casual-loop" rev-parse HEAD)" = "$PROVIDER_HEAD"

      - name: Execute real provider through consumer adapter
        run: |
          node examples/causal-loop-runtime-observation.js \
            "$GITHUB_WORKSPACE/.provider/axm-casual-loop" \
            "$PROVIDER_HEAD" > "$RUNNER_TEMP/causal-loop-runtime-observation.json"

      - name: Independently verify emitted consumer receipt
        run: |
          OBSERVATION="$RUNNER_TEMP/causal-loop-runtime-observation.json" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { verifyCausalLoopRuntimeObservation } from './src/causal-loop-runtime.js';
          const receipt = JSON.parse(readFileSync(process.env.OBSERVATION, 'utf8'));
          const verified = verifyCausalLoopRuntimeObservation(receipt);
          if (verified.status !== 'PASS') throw new Error('runtime observation did not verify');
          if (verified.runtimeObserved !== true) throw new Error('provider was not runtime-observed');
          if (receipt.provider.sourceRef !== process.env.PROVIDER_HEAD) throw new Error('provider ref receipt mismatch');
          if (receipt.observation.providerReceiptCommitted !== false) throw new Error('uncommitted provider boundary drifted');
          if (receipt.authority.kind !== 'RUNTIME_EVIDENCE_ONLY' || receipt.authority.merge !== false || receipt.authority.canon !== false) {
            throw new Error('consumer authority boundary drifted');
          }
          console.log(JSON.stringify({
            consumerReceipt: verified.receiptSha256,
            providerReceipt: verified.providerReceiptHash,
            providerHead: receipt.provider.sourceRef,
            authority: verified.authority
          }));
          NODE
