name: test

on:
  push:
    branches: [main, 'chat/**']
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run demo:clone > /dev/null
      - run: npm run demo:creation > /dev/null
      - run: npm run demo:decomposition > /dev/null
