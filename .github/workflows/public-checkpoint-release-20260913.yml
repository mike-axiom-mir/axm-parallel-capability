name: Publish 2026-09-13 public checkpoint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-checkpoint-release-20260913.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create prerelease checkpoint once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: public-checkpoint-2026-09-13
          STAGE: "Experimental reusable parallel-capability fabric with bounded orchestration, clone, merge, registry, and checkpoint evidence."
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          repo_name="${GITHUB_REPOSITORY#*/}"
          printf '%s\n\n%s\n\n%s\n\n%s\n' "Public experimental checkpoint of ${repo_name}." "Current public stage: ${STAGE}" "This prerelease records the exact repository state at the tagged commit. It does not create automatic merge/CANON authority or claim hostile-code isolation beyond the documented harness." "AXM-owned source is Apache-2.0; third-party material retains its own upstream terms. Read README.md and the repository contracts/evidence for details." > release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${repo_name} — Public Checkpoint 2026-09-13" --notes-file release-notes.md --prerelease
